<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rickshaw & Bike Live Network - Enterprise</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body, #map { height: 100%; width: 100%; overflow: hidden; background: #e5e3df; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; justify-content: center; align-items: center; z-index: 99999; }
        .modal-box { background: #ffffff; padding: 24px 20px; border-radius: 20px; text-align: center; width: 90%; max-width: 360px; box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
        .modal-box h2 { font-size: 20px; color: #111; margin-bottom: 6px; font-weight: 800; }
        .modal-box p { font-size: 12px; color: #666; margin-bottom: 18px; line-height: 1.4; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .role-btn { padding: 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-rider { background: #e63946; }
        .btn-sawari { background: #2a9d8f; }
        .btn-bike-rider { background: #d97706; }
        .btn-bike-sawari { background: #7c3aed; }

        .otp-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; text-align: center; }
        .otp-btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }

        .status-card { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 1000; background: #ffffff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 18px rgba(0,0,0,0.18); display: none; align-items: center; gap: 10px; }
        .badge { width: 12px; height: 12px; border-radius: 50%; display: none; }
        .badge-green { background: #16a34a; display: inline-block; }
        .badge-red { background: #dc2626; display: inline-block; }

        .traffic-counter { position: fixed; top: 14px; right: 14px; z-index: 1000; background: rgba(0, 0, 0, 0.75); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; display: none; }

        .dest-card { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: #ffffff; padding: 12px 18px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); font-size: 13px; font-weight: 600; color: #222; display: none; align-items: center; gap: 12px; width: 90%; max-width: 360px; justify-content: space-between; }
        .btn-reset { background: #e63946; color: white; border: none; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; }

        .chat-overlay { display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 360px; background: #fff; z-index: 2000; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); padding: 14px; }
        .chat-box { max-height: 140px; overflow-y: auto; border: 1px solid #ddd; padding: 8px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; background: #f9f9f9; }
        .chat-input-row { display: flex; gap: 4px; margin-bottom: 6px; }
        .chat-input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 11px; }
        .chat-send-btn { background: #7c3aed; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .chat-extra-row { display: flex; gap: 6px; justify-content: space-between; }
        .extra-btn { flex: 1; background: #2563eb; color: white; border: none; padding: 6px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; text-align: center; }
        .extra-btn.recording { background: #dc2626; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .request-popup { display: none; position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 2000; background: #fff; padding: 12px 18px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); text-align: center; width: 90%; max-width: 340px; }
        .req-btn-group { display: flex; gap: 10px; margin-top: 8px; justify-content: center; }
        .btn-accept { background: #16a34a; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-reject { background: #dc2626; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .custom-pin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 12px rgba(0,0,0,0.4); }
        .pin-self { background-color: #1d4ed8; }
        .pin-rider { background-color: #e63946; }
        .pin-sawari { background-color: #2a9d8f; }
        .pin-bike-rider { background-color: #d97706; }
        .pin-bike-sawari { background-color: #7c3aed; }
        
        .pin-glow {
            box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.9), 0 3px 12px rgba(0,0,0,0.4);
            animation: ring-pulse 1.5s infinite;
        }
        @keyframes ring-pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.8); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(22, 163, 74, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
        }

        .direction-arrow { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid #ffffff; }
        .sawari-inner { width: 12px; height: 12px; background: #ffffff; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="roleModal" style="display: none;">
        <div class="modal-box">
            <h2>मोड चुनें (Select Mode)</h2>
            <p>आप किस रूप में काम करना चाहते हैं?</p>
            <div class="btn-group">
                <button class="role-btn btn-rider" onclick="selectRole('rider')">ऑटो / ई-रिक्शा चालक</button>
                <button class="role-btn btn-sawari" onclick="selectRole('sawari')">ऑटो यात्री (सवारी)</button>
                <button class="role-btn btn-bike-rider" onclick="selectRole('bike_rider')">🏍️ बाइक चालक (सुबह 6 से शाम 7)</button>
                <button class="role-btn btn-bike-sawari" onclick="selectRole('bike_sawari')">🙋‍♂️ बाइक यात्री (सुबह 6 से शाम 7)</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="otpModal" style="display: none;">
        <div class="modal-box">
            <h2>मोबाइल सत्यापन</h2>
            <p>कृपया अपना 10 अंकों का मोबाइल नंबर और OTP (कोड: 7317) दर्ज करें।</p>
            <input type="tel" id="mobileInput" class="otp-input" placeholder="मोबाइल नंबर (10 अंक)" maxlength="10">
            <input type="password" id="otpInput" class="otp-input" placeholder="OTP दर्ज करें (7317)" maxlength="4">
            <button class="otp-btn" onclick="verifyOtpAndStart()">सत्यापित करें और आगे बढ़ें</button>
        </div>
    </div>

    <div class="status-card" id="statusBar">
        <div id="statusDot" class="badge"></div>
        <span id="statusText">लाइव नेटवर्क सक्रिय है</span>
    </div>

    <div class="traffic-counter" id="trafficCounter">
        🌍 चालक: <span id="totalRiders">0</span> | सवारी: <span id="totalSawaris">0</span>
    </div>

    <div class="request-popup" id="requestPopup">
        <p id="reqText" style="font-size: 12px; font-weight: bold; color: #111;"></p>
        <div class="req-btn-group">
            <button class="btn-accept" onclick="acceptRequest()">स्वीकार करें</button>
            <button class="btn-reject" onclick="rejectRequest()">अस्वीकार करें</button>
        </div>
    </div>

    <div class="chat-overlay" id="chatOverlay">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span id="chatHeaderTitle" style="font-size: 11px; font-weight: bold; color: #7c3aed;">💬 प्राइवेट चैट और लाइव ट्रैकिंग</span>
            <button onclick="closeChat()" style="background:none; border:none; font-weight:bold; cursor:pointer; color:#666;">✕ बंद करें</button>
        </div>
        <div class="chat-box" id="chatMessages"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" class="chat-input" placeholder="संदेश लिखें...">
            <button class="chat-send-btn" onclick="sendChatMessage()">भेजें</button>
        </div>
        <div class="chat-extra-row">
            <button class="extra-btn" id="voiceBtn" onclick="toggleVoiceRecording()">🎤 वॉइस रिकॉर्ड</button>
            <button class="extra-btn" style="background:#059669;" onclick="shareGoogleLocation()">📍 लोकेशन शेयर</button>
        </div>
    </div>

    <div class="dest-card" id="destCard">
        <span id="destStatus">मैप पर टैप करके अपनी मंजिल (Destination) सेट करें</span>
        <button class="btn-reset" onclick="resetDestination()">रूट रीसेट</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        let map = null, socket = null, myId = 'user_' + Math.floor(Math.random() * 1000000);
        let myRole = null, selfMarker = null, myLat = null, myLng = null, myHeading = 0, myDestination = null;
        let destMarker = null, destLine = null, activeMarkers = {}, activeRoutes = {}, isMapCentered = false;
        let incomingReqData = null, activeChatRoom = null, connectedPartnerId = null;
        let isPassengerActive = true, tempSelectedRole = null;
        let requestedRiders = {}; 
        
        let mediaRecorder = null, audioChunks = [], recordedAudioBase64 = null, isRecording = false;

        window.onload = function() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            const savedMobile = localStorage.getItem('rickshaw_user_mobile');
            if (savedMobile) {
                document.getElementById('otpModal').style.display = 'none';
                document.getElementById('roleModal').style.display = 'flex';
            } else {
                document.getElementById('otpModal').style.display = 'flex';
                document.getElementById('roleModal').style.display = 'none';
            }
        };

        function selectRole(role) {
            if (role === 'bike_rider' || role === 'bike_sawari') {
                const currentHour = new Date().getHours();
                if (currentHour < 6 || currentHour >= 19) {
                    alert('⚠️ बाइक मोड सिर्फ सुबह 6 AM से शाम 7 PM तक ही सक्रिय रहता है!');
                    return;
                }
            }
            myRole = role;
            document.getElementById('roleModal').style.display = 'none';
            initializeAppAfterLogin();
        }

        async function verifyOtpAndStart() {
            const mobileNumber = document.getElementById('mobileInput').value.trim();
            const enteredOtp = document.getElementById('otpInput').value.trim();

            if (mobileNumber.length < 10) {
                alert('कृपया सही 10 अंकों का मोबाइल नंबर डालें।');
                return;
            }

            try {
                let response = await fetch('/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobileNumber, enteredOtp })
                });
                let result = await response.json();

                if (result.success) {
                    localStorage.setItem('rickshaw_user_mobile', mobileNumber);
                    document.getElementById('otpModal').style.display = 'none';
                    document.getElementById('roleModal').style.display = 'flex';
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert('सर्वर कनेक्शन त्रुटि!');
            }
        }

        function initializeAppAfterLogin() {
            if (myRole === 'sawari' || myRole === 'bike_sawari') {
                const handleVisibility = () => {
                    if (document.hidden || document.visibilityState === 'hidden') {
                        isPassengerActive = false;
                        if (socket && socket.connected) {
                            socket.emit('deactivate_passenger', { id: myId });
                        }
                    } else {
                        isPassengerActive = true;
                        syncPosition();
                    }
                };

                document.addEventListener("visibilitychange", handleVisibility);
                window.addEventListener("pagehide", () => {
                    if (socket && socket.connected) {
                        socket.emit('deactivate_passenger', { id: myId });
                    }
                });
            }

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    myHeading = pos.coords.heading || 0;
                    initMapAndSystem();
                }, (err) => {
                    alert('लोकेशन एक्सेस जरूरी है! डिफ़ॉल्ट लोकेशन सेट की जा रही है।');
                    myLat = 20.5937; myLng = 78.9629;
                    initMapAndSystem();
                }, { enableHighAccuracy: true, timeout: 10000 });
            } else {
                myLat = 20.5937; myLng = 78.9629;
                initMapAndSystem();
            }
        }

        function getIcon(role, heading = 0, isSelf = false, isGlowing = false) {
            let bgClass = '', innerElement = '';
            if (isSelf) {
                bgClass = 'pin-self';
                innerElement = '<div class="direction-arrow" style="transform: rotate(' + heading + 'deg);"></div>';
            } else if (role === 'rider') {
                bgClass = 'pin-rider';
                innerElement = '<div class="direction-arrow" style="transform: rotate(' + heading + 'deg);"></div>';
            } else if (role === 'bike_rider') {
                bgClass = 'pin-bike-rider';
                innerElement = '<div class="direction-arrow" style="transform: rotate(' + heading + 'deg);"></div>';
            } else if (role === 'bike_sawari') {
                bgClass = 'pin-bike-sawari';
                innerElement = '<div class="sawari-inner"></div>';
            } else {
                bgClass = 'pin-sawari';
                innerElement = '<div class="sawari-inner"></div>';
            }

            if (isGlowing) bgClass += ' pin-glow';

            return L.divIcon({ className: '', html: '<div class="custom-pin ' + bgClass + '">' + innerElement + '</div>', iconSize: [22, 22], iconAnchor: [11, 11] });
        }

        function initMapAndSystem() {
            const statusBar = document.getElementById('statusBar');
            statusBar.style.display = 'flex';
            document.getElementById('trafficCounter').style.display = 'block';

            if (myRole === 'sawari' || myRole === 'bike_sawari') {
                document.getElementById('destCard').style.display = 'flex';
            }

            if (!map) {
                map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([myLat, myLng], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                L.control.zoom({ position: 'bottomright' }).addTo(map);

                if (myRole === 'sawari' || myRole === 'bike_sawari') {
                    map.on('click', setDestination);
                }
            }
            map.invalidateSize();

            selfMarker = L.marker([myLat, myLng], { icon: getIcon(myRole, myHeading, true) }).addTo(map).bindPopup('<b>आपकी लोकेशन</b>');

            connectSocketServer();
            startLiveGPS();

            let syncIntervalTime = (myRole === 'rider' || myRole === 'bike_rider') ? 2000 : 3000;
            setInterval(() => { syncPosition(); }, syncIntervalTime);
        }

        function setDestination(e) {
            if (!myLat || !myLng) return;
            myDestination = { lat: e.latlng.lat, lng: e.latlng.lng };

            if (destMarker) map.removeLayer(destMarker);
            if (destLine) map.removeLayer(destLine);

            destMarker = L.marker([myDestination.lat, myDestination.lng]).addTo(map).bindPopup('<b>आपकी मंजिल</b>').openPopup();
            destLine = L.polyline([[myLat, myLng], [myDestination.lat, myDestination.lng]], { color: '#2a9d8f', weight: 4, dashArray: '6, 8' }).addTo(map);

            document.getElementById('destStatus').innerText = 'मंजिल सेट हो गई है!';
            syncPosition();
        }

        function resetDestination() {
            myDestination = null;
            if (destMarker) map.removeLayer(destMarker);
            if (destLine) map.removeLayer(destLine);
            document.getElementById('destStatus').innerText = 'मैप पर टैप करके अपनी मंजिल सेट करें';
            syncPosition(); // Server par null destination bhejega jisse rider ki screen se bhi route hat jayega
        }

        function startLiveGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        myLat = pos.coords.latitude;
                        myLng = pos.coords.longitude;
                        myHeading = pos.coords.heading || 0;

                        if (map) {
                            if (!isMapCentered) {
                                map.setView([myLat, myLng], 16);
                                isMapCentered = true;
                            }
                            if (selfMarker) {
                                selfMarker.setLatLng([myLat, myLng]);
                                selfMarker.setIcon(getIcon(myRole, myHeading, true));
                            }
                        }

                        if (myDestination && destLine) {
                            destLine.setLatLngs([[myLat, myLng], [myDestination.lat, myDestination.lng]]);
                        }

                        syncPosition();
                    },
                    (err) => {},
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        function connectSocketServer() {
            if (socket) return;
            socket = io({ transports: ['websocket'], reconnection: true });

            socket.on('connect', () => { syncPosition(); });

            socket.on('init_users', (users) => {
                updateTrafficCounts(users);
                for (let id in users) {
                    if (id !== myId) processIncomingUser(users[id]);
                }
            });

            socket.on('live_broadcast', (data) => { 
                if (data && data.user && data.user.id !== myId) {
                    processIncomingUser(data.user);
                }
                if (data && data.counts) {
                    document.getElementById('totalRiders').innerText = (data.counts.riders || 0);
                    document.getElementById('totalSawaris').innerText = (data.counts.sawaris || 0);
                }
            });

            socket.on('remove_user', (data) => { 
                removeUser(data.id);
                if (data && data.counts) {
                    document.getElementById('totalRiders').innerText = (data.counts.riders || 0);
                    document.getElementById('totalSawaris').innerText = (data.counts.sawaris || 0);
                }
            });

            socket.on('receive_sms_request', (data) => {
                if (myRole === 'bike_rider' || myRole === 'rider') {
                    incomingReqData = data;
                    document.getElementById('reqText').innerText = '🙋‍♂️ नई सवारी रिक्वेस्ट आई है!';
                    document.getElementById('requestPopup').style.display = 'block';

                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("नयी सवारी रिक्वेस्ट!", {
                            body: "आपके पास एक नयी राइड रिक्वेस्ट आई है।",
                            icon: "https://cdn-icons-png.flaticon.com/512/854/854878.png"
                        });
                    }
                }
            });

            socket.on('request_accepted', (data) => {
                if (myId === data.passengerId || myId === data.riderId) {
                    activeChatRoom = data.room;
                    connectedPartnerId = (myId === data.riderId) ? data.passengerId : data.riderId;

                    document.getElementById('chatMessages').innerHTML = '';
                    document.getElementById('requestPopup').style.display = 'none';
                    document.getElementById('chatOverlay').style.display = 'block';
                    
                    document.getElementById('chatHeaderTitle').innerText = '💬 लाइव कनेक्टेड';

                    document.getElementById('statusDot').className = 'badge badge-green';
                    document.getElementById('statusText').innerText = 'लाइव जुड़े हुए हैं';
                    appendChatMessage('सिस्टम', 'आप आपस में कनेक्ट हो गए हैं।');
                }
            });

            socket.on('request_rejected', (data) => {
                if (myId === data.passengerId) {
                    alert('❌ सामने वाले ने आपकी रिक्वेस्ट अस्वीकार कर दी है।');
                    requestedRiders[data.riderId] = false; 
                    if (activeMarkers[data.riderId]) {
                        processIncomingUserMarkerRefresh(data.riderId);
                    }
                }
            });

            socket.on('chat_message', (msg) => {
                if (activeChatRoom === msg.room) {
                    let senderLabel = (msg.senderId === myId) ? 'आप' : msg.senderRole.toUpperCase();
                    if (msg.type === 'audio') {
                        appendAudioMessage(senderLabel, msg.audioData);
                    } else if (msg.type === 'location') {
                        appendLocationMessage(senderLabel, msg.lat, msg.lng);
                    } else {
                        appendChatMessage(senderLabel, msg.text);
                    }
                }
            });

            socket.on('chat_closed', (data) => {
                if (activeChatRoom === data.room) {
                    // 1. Sirf 2 second ke liye Hindi mein disconnect notification dikhayein
                    document.getElementById('statusDot').className = 'badge badge-red';
                    document.getElementById('statusText').innerText = 'सम्पर्क टूट गया है (Disconnected)';
                    appendChatMessage('सिस्टम', 'कन्वर्सेशन बंद कर दी गई है।');
                    
                    setTimeout(() => {
                        // 2 second baad wapas normal "Live Network Active" status par laayein
                        document.getElementById('statusDot').className = 'badge badge-green';
                        document.getElementById('statusText').innerText = 'लाइव नेटवर्क सक्रिय है';
                        document.getElementById('chatMessages').innerHTML = '';
                        document.getElementById('chatOverlay').style.display = 'none';
                    }, 2000);

                    connectedPartnerId = null;
                    activeChatRoom = null;
                    incomingReqData = null;

                    for (let id in activeRoutes) {
                        map.removeLayer(activeRoutes[id]);
                        delete activeRoutes[id];
                    }
                }
            });
        }

        function updateTrafficCounts(users) {
            let rCount = 0, sCount = 0;
            for (let id in users) {
                if (users[id].role === 'rider' || users[id].role === 'bike_rider') rCount++;
                if (users[id].role === 'sawari' || users[id].role === 'bike_sawari') sCount++;
            }
            document.getElementById('totalRiders').innerText = rCount;
            document.getElementById('totalSawaris').innerText = sCount;
        }

        function syncPosition() {
            if ((myRole === 'sawari' || myRole === 'bike_sawari') && !isPassengerActive) return;

            if (socket && socket.connected && myLat !== null && myLng !== null) {
                socket.emit('update_location', { id: myId, role: myRole, lat: myLat, lng: myLng, heading: myHeading, destination: myDestination });
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function processIncomingUser(user) {
            if (!myLat || !myLng || !map) return;
            const distance = calculateDistance(myLat, myLng, user.lat, user.lng);
            let maxRadius = 0;
            let showPopupBtn = false;
            let canSee = false;

            if (myRole === 'rider') {
                if ((user.role === 'rider' || user.role === 'sawari') && distance <= 25) {
                    canSee = true; maxRadius = 25;
                    if (user.role === 'rider' && distance <= 10) {
                        showPopupBtn = true;
                    }
                }
            } 
            else if (myRole === 'sawari') {
                if (user.role === 'rider' && distance <= 10) {
                    canSee = true; maxRadius = 10; showPopupBtn = true;
                }
            } 
            else if (myRole === 'bike_rider') {
                if ((user.role === 'bike_rider' || user.role === 'bike_sawari') && distance <= 5) {
                    canSee = true; maxRadius = 5;
                }
            } 
            else if (myRole === 'bike_sawari') {
                if (user.role === 'bike_rider' && distance <= 5) {
                    canSee = true; maxRadius = 5;
                    if (distance <= 2.5) showPopupBtn = true;
                }
            }

            if (user.id === connectedPartnerId) canSee = true;

            if (!canSee || (user.id !== connectedPartnerId && distance > maxRadius)) {
                removeUser(user.id);
                return;
            }

            let isGlowing = (user.id === connectedPartnerId);

            if (activeMarkers[user.id]) {
                activeMarkers[user.id].setLatLng([user.lat, user.lng]);
                activeMarkers[user.id].setIcon(getIcon(user.role, user.heading || 0, false, isGlowing));
            } else {
                let popupHtml = '<b>' + user.role.toUpperCase() + '</b><br>दूरी: ' + distance.toFixed(1) + ' किमी';
                if (showPopupBtn) {
                    if (requestedRiders[user.id]) {
                        popupHtml += '<br><button style="background:#6b7280; color:#fff; border:none; padding:4px 8px; border-radius:4px; margin-top:6px;" disabled>⏳ अनुरोध भेजा गया...</button>';
                    } else {
                        popupHtml += '<br><button onclick="sendSmsRequest(\'' + user.id + '\')" style="background:#7c3aed; color:#fff; border:none; padding:4px 8px; border-radius:4px; margin-top:6px; cursor:pointer;">📲 रिक्वेस्ट भेजें</button>';
                    }
                }
                activeMarkers[user.id] = L.marker([user.lat, user.lng], { icon: getIcon(user.role, user.heading || 0, false, isGlowing) }).addTo(map)
                    .bindPopup(popupHtml);
            }

            // Agar passenger ne destination reset kiya hai (null), toh rider ke map se route line hata dein
            if ((myRole === 'rider' || myRole === 'bike_rider') && (user.role === 'sawari' || user.role === 'bike_sawari')) {
                if (user.destination) {
                    if (activeRoutes[user.id]) {
                        activeRoutes[user.id].setLatLngs([[user.lat, user.lng], [user.destination.lat, user.destination.lng]]);
                    } else {
                        activeRoutes[user.id] = L.polyline([[user.lat, user.lng], [user.destination.lat, user.destination.lng]], { color: '#2a9d8f', weight: 4, dashArray: '6, 8' }).addTo(map);
                    }
                } else {
                    if (activeRoutes[user.id]) {
                        map.removeLayer(activeRoutes[user.id]);
                        delete activeRoutes[user.id];
                    }
                }
            }
        }

        function processIncomingUserMarkerRefresh(riderId) {
            if (activeMarkers[riderId]) {
                let popupHtml = '<b>चालक (RIDER)</b><br><button onclick="sendSmsRequest(\'' + riderId + '\')" style="background:#7c3aed; color:#fff; border:none; padding:4px 8px; border-radius:4px; margin-top:6px; cursor:pointer;">📲 रिक्वेस्ट भेजें</button>';
                activeMarkers[riderId].bindPopup(popupHtml).openPopup();
            }
        }

        function sendSmsRequest(riderId) {
            requestedRiders[riderId] = true;
            socket.emit('send_sms_request', { passengerId: myId, riderId: riderId });
            alert('रिक्वेस्ट सफलतापूर्वक भेज दी गई है!');
            processIncomingUserMarkerRefresh(riderId);
        }

        function acceptRequest() {
            document.getElementById('requestPopup').style.display = 'none';
            if (incomingReqData) {
                socket.emit('accept_sms_request', incomingReqData);
            }
        }

        function rejectRequest() {
            document.getElementById('requestPopup').style.display = 'none';
            if (incomingReqData) {
                socket.emit('reject_sms_request', incomingReqData);
                incomingReqData = null;
            }
        }

        function sendChatMessage() {
            const text = document.getElementById('chatInput').value;
            if (text && activeChatRoom) {
                socket.emit('chat_message', { room: activeChatRoom, senderId: myId, senderRole: myRole, type: 'text', text: text });
                document.getElementById('chatInput').value = '';
            } 
            else if (recordedAudioBase64 && activeChatRoom) {
                socket.emit('chat_message', { room: activeChatRoom, senderId: myId, senderRole: myRole, type: 'audio', audioData: recordedAudioBase64 });
                recordedAudioBase64 = null;
                document.getElementById('voiceBtn').innerText = '🎤 वॉइस रिकॉर्ड';
                alert('वॉइस रिकॉर्डिंग भेज दी गई है!');
            }
        }

        function appendChatMessage(sender, text) {
            const box = document.getElementById('chatMessages');
            box.innerHTML += '<div><b>' + sender + ':</b> ' + text + '</div>';
            box.scrollTop = box.scrollHeight;
        }

        function appendAudioMessage(sender, audioData) {
            const box = document.getElementById('chatMessages');
            box.innerHTML += '<div><b>' + sender + ':</b> <audio controls src="' + audioData + '" style="height:25px; vertical-align:middle;"></audio></div>';
            box.scrollTop = box.scrollHeight;
        }

        function appendLocationMessage(sender, lat, lng) {
            const box = document.getElementById('chatMessages');
            let mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            box.innerHTML += '<div><b>' + sender + ':</b> <a href="' + mapsUrl + '" target="_blank" style="color:#2563eb; font-weight:bold;">📍 गूगल मैप्स लोकेशन देखें</a></div>';
            box.scrollTop = box.scrollHeight;
        }

        function shareGoogleLocation() {
            if (!myLat || !myLng || !activeChatRoom) {
                alert('लोकेशन या चैट सक्रिय नहीं है!');
                return;
            }
            socket.emit('chat_message', { room: activeChatRoom, senderId: myId, senderRole: myRole, type: 'location', lat: myLat, lng: myLng });
        }

        function toggleVoiceRecording() {
            const btn = document.getElementById('voiceBtn');
            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            recordedAudioBase64 = reader.result;
                            btn.innerText = '✅ रिकॉर्ड हो गया (भेजें)';
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.innerText = '🔴 रिकॉर्डिंग जारी... (रोकें)';
                    btn.classList.add('recording');
                }).catch(err => alert('माइक्रोफोन की अनुमति नहीं मिली!'));
            } else {
                if (mediaRecorder) mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }

        function closeChat() {
            if (activeChatRoom) {
                socket.emit('close_chat', { room: activeChatRoom });
            }
            document.getElementById('chatOverlay').style.display = 'none';
            
            // 2 second ke liye Hindi mein disconnect notification dikhayein
            document.getElementById('statusDot').className = 'badge badge-red';
            document.getElementById('statusText').innerText = 'सम्पर्क टूट गया है (Disconnected)';
            
            setTimeout(() => {
                document.getElementById('statusDot').className = 'badge badge-green';
                document.getElementById('statusText').innerText = 'लाइव नेटवर्क सक्रिय है';
                document.getElementById('chatMessages').innerHTML = '';
            }, 2000);
            
            activeChatRoom = null;
            incomingReqData = null;
            connectedPartnerId = null;

            for (let id in activeRoutes) {
                map.removeLayer(activeRoutes[id]);
                delete activeRoutes[id];
            }
        }

        function removeUser(id) {
            if (activeMarkers[id]) { map.removeLayer(activeMarkers[id]); delete activeMarkers[id]; }
            if (activeRoutes[id]) { map.removeLayer(activeRoutes[id]); delete activeRoutes[id]; }
        }
    </script>
</body>
</html>
